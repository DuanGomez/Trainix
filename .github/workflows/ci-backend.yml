name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'trainix-backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'trainix-backend/**'

jobs:
  build:
    name: Build & seed
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trainix-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: trainix-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SQLite no necesita servicios externos: el seed valida entidades y esquema.
      - name: Seed database (smoke test)
        run: npm run seed
        env:
          DB_PATH: data/ci.sqlite
